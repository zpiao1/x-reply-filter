<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X Reply Filter Diagnostics</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 420px;
        max-height: 560px;
        overflow-y: auto;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        background: #0f1419;
        color: #e7e9ea;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .brand img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }
      h2 {
        margin: 12px 0 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #8b98a5;
      }
      .status-pill {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(0, 186, 124, 0.16);
        color: #00ba7c;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .card {
        background: #16181c;
        border: 1px solid #2f3336;
        border-radius: 8px;
        padding: 6px 8px;
      }
      .card-label {
        font-size: 10px;
        color: #8b98a5;
      }
      .card-value {
        font-size: 15px;
        font-weight: 700;
        margin-top: 2px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        background: #16181c;
        border: 1px solid #2f3336;
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 11px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #16181c;
        border: 1px solid #2f3336;
        border-radius: 8px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        padding: 5px 7px;
        border-bottom: 1px solid #2f3336;
        font-size: 11px;
      }
      th {
        color: #8b98a5;
        font-weight: 600;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .verdict-row {
        background: #16181c;
        border: 1px solid #2f3336;
        border-radius: 8px;
        padding: 6px 8px;
        margin-bottom: 6px;
      }
      .verdict-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .tag-dim {
        color: #f47178;
      }
      .tag-keep {
        color: #00ba7c;
      }
      .verdict-snippet {
        color: #d6d9db;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
      }
      .verdict-metrics {
        color: #8b98a5;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .empty {
        color: #8b98a5;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading diagnostics...</div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
